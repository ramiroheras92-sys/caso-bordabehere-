<title>Expediente 0735 · El caso Bordabehere</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--desk:#1b1713;--paper:#eadfc3;--paper2:#d9ccaa;--ink:#2a2118;--red:#a3262a;--ok:#2f6b3a;--navy:#243b55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--desk)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;padding:12px;background:var(--desk);color:var(--ink);font:16px/1.55 'Courier Prime','Courier New',monospace}
.sheet{position:relative;max-width:660px;margin:14px auto;padding:22px 18px 20px;background:repeating-linear-gradient(var(--paper) 0 27px,#e0d4b6 27px 28px);border-radius:2px;box-shadow:0 6px 0 -2px #0006,0 14px 30px #000a;overflow:hidden}
.sheet:before{content:"";position:absolute;top:-6px;left:22px;width:70px;height:20px;background:#c9b98a99;transform:rotate(-3deg)}
h1,h2,.exp,.stamp,.b,.code{font-family:'Special Elite','Courier New',monospace}
h1{font-size:2.5rem;line-height:1.05;margin:.3em 0 .1em;letter-spacing:.02em}
h2{font-size:1.35rem;margin:.2em 0 .6em}
.exp{margin:0 0 .4em;color:var(--navy);font-size:.95rem;letter-spacing:.06em}
.sub{font-style:italic;font-size:1.1rem;margin:0 0 .8em}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);padding:1px 10px;transform:rotate(-5deg);letter-spacing:.15em;opacity:.88;font-size:1.05rem}
.stamp.v{border-color:var(--ok);color:var(--ok)}
.bl{margin:.5em 0}
blockquote{margin:.9em 0;padding:8px 12px;border-left:4px solid var(--red);background:#0000000d;font-style:italic}
.ask{border:2px dashed var(--navy);padding:8px 10px;margin:.9em 0}
hr{border:0;border-top:2px dashed #2a211855;margin:1.1em 0}
.foto{float:right;width:116px;margin:0 0 8px 12px;padding:6px 6px 4px;background:#f6f1e3;box-shadow:0 3px 8px #0006;transform:rotate(2.5deg);text-align:center}
.foto div{height:140px;background:linear-gradient(160deg,#b7a67c,#7d6c48);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.foto svg{width:80px;height:92px;fill:#4d4230;opacity:.65}
.foto small{display:block;font-size:.62rem;line-height:1.1;padding-top:4px}
.foto img{width:100%;height:100%;object-fit:cover;object-position:top;filter:sepia(.8) contrast(1.05)}
.af{margin:.9em 0;padding:10px;background:#fffaf0aa;border:1px solid #2a211833}
.af p{margin:0 0 8px}
.ch{display:flex;gap:6px;flex-wrap:wrap}
.c{flex:1 1 90px;min-height:44px;padding:6px 8px;font:700 .8rem 'Courier Prime',monospace;color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:2px;cursor:pointer}
.c.on{background:var(--ink);color:var(--paper)}
.c.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.c.no{background:var(--red);border-color:var(--red);color:#fff}
.c:disabled{cursor:default}
.c:focus-visible,.b:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.why{margin:8px 0 0;font-size:.9rem}
.b{display:block;width:100%;margin-top:14px;padding:12px;font-size:1.1rem;color:var(--paper);background:var(--navy);border:0;border-radius:2px;cursor:pointer;box-shadow:0 3px 0 #0006}
.b:disabled{opacity:.4;cursor:not-allowed}
input,textarea{width:100%;margin-top:6px;padding:10px;font:1rem 'Courier Prime',monospace;color:var(--ink);background:#fffaf0;border:2px solid var(--ink);border-radius:2px}
textarea{min-height:110px}
label{display:block;margin-top:16px;font-weight:700}
.pt{font-weight:700;margin:12px 0 0}
.big{font-family:'Special Elite',monospace;font-size:3rem;margin:.1em 0;color:var(--navy)}
.code{display:block;margin:10px 0;padding:12px;background:#fffaf0;border:2px dashed var(--ink);font-size:1.2rem;word-break:break-all;text-align:center}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:10px}
th,td{padding:5px 3px;border-bottom:1px solid #2a211844;text-align:center}
th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}
.prog{max-width:660px;margin:0 auto;color:#cdbf9a;font-size:.85rem;text-align:center}
.wide{margin:6px 0 14px;padding:6px;background:#f6f1e3;box-shadow:0 3px 8px #0006;transform:rotate(-1deg)}.wide img{display:block;width:100%;filter:sepia(.45) contrast(1.05)}
@media (max-width:420px){h1{font-size:2rem}}
</style>

const P=[
{t:'La escena del crimen',h:'El Senado, 23 de julio de 1935',b:['La sesión comenzó con una denuncia explosiva de Lisandro de la Torre contra los frigoríficos Anglo y Swift.','De la Torre acusaba al ministro Luis Duhau y al ex ministro Alberto Hueyo de encubrir irregularidades en el Pacto Roca-Runciman.','El debate subió de tono. Duhau se levantó y fue directamente al sector de la oposición.','Ramón Valdez Cora, ligado al entorno conservador, sacó un arma y disparó.','Bordabehere recibió los disparos y cayó herido.','Valdez Cora fue detenido en el acto.'],q:'“Han matado a Bordabehere porque no pudieron matarme a mí.” (Lisandro de la Torre, Senado de la Nación, 23/07/1935)',x:[['Valdez Cora disparó en el recinto del Senado.','P','Fue detenido en el acto, arma en mano.'],['Bordabehere recibió los disparos en el recinto.','P','Los hechos materiales no están en duda.'],['Los disparos iban dirigidos a De la Torre.','I','Se apoya en su testimonio y en el contexto, no en una sentencia.'],['Duhau participó en el ataque porque se levantó y fue hacia la oposición.','S','Moverse en el recinto no prueba participación; ninguna fuente lo afirma.']]},
{f:'valdez',fl:'Ramón Valdez Cora',t:'El ejecutor material',h:'Sospechoso Nº 1: Ramón Valdez Cora',b:['Militante conservador, vinculado a grupos de choque ligados a la Legión Cívica.','Fue detenido en el Senado mismo, pistola en mano. Los hechos materiales del crimen nunca estuvieron en duda.','La investigación judicial fue una farsa: lo condenaron a pocos años de prisión y fue amnistiado. Nunca se investigó en profundidad a sus posibles mandantes.'],pq:'Si Valdez Cora fue detenido en el acto, ¿por qué la justicia no investigó a quienes podrían haberlo enviado? ¿A quién protegía la impunidad?',x:[['Valdez Cora fue amnistiado.','P','Lo indican las fuentes del caso.'],['Alguien más ordenó el crimen y la impunidad lo protegió.','I','Nunca se investigó a los mandantes: es sospecha, no prueba.'],['Valdez Cora actuó solo, por iniciativa propia.','S','Nada en las fuentes lo sostiene; justamente no se investigó.'],['La condena leve y la amnistía sugieren que se quiso proteger a alguien.','I','Es una interpretación razonable de los hechos, pero no hay una prueba de ello.']]},
{t:'El contexto económico',h:'El Pacto Roca-Runciman (1933)',b:['Firmado en Londres en 1933 entre el vicepresidente Julio A. Roca (h.) y el ministro británico Runciman: carbón inglés y condiciones preferenciales para los frigoríficos británicos, a cambio de seguir vendiendo carne a Inglaterra.','De la Torre denunciaba que Anglo y Swift pagaban precios bajos a los ganaderos argentinos y que el gobierno de Justo no los fiscalizaba.','Decía que Duhau y Hueyo habrían recibido beneficios a cambio de proteger los intereses británicos.','En juego: millones en ganancias que salían del país sin tributar y la reputación de funcionarios del gobierno.'],x:[['El Pacto se firmó en Londres en 1933 entre Roca (h.) y Runciman.','P','Es un hecho histórico documentado.'],['Duhau y Hueyo recibieron beneficios personales de los frigoríficos.','I','Es una acusación de De la Torre; nunca hubo condena.'],['Los frigoríficos ordenaron el asesinato.','S','Nadie lo probó y las fuentes no lo afirman.'],['Los frigoríficos pagaban precios bajos a los ganaderos argentinos.','I','Es parte de la denuncia de De la Torre, no un hecho comprobado en el texto.']]},
{t:'Mapa de intereses',h:'¿Quiénes tenían algo que perder?',b:['<b>Gobierno de Justo:</b> llegó al poder por fraude; el Pacto era su política exterior clave.','<b>Ministros Duhau y Hueyo:</b> acusados por De la Torre de recibir beneficios de los frigoríficos.','<b>Frigoríficos Anglo y Swift:</b> las denuncias podían traer auditorías, nuevas regulaciones o la ruptura del Pacto.','<b>Partido conservador:</b> aliado de Justo; sus grupos de choque actuaban contra la oposición.','<b>Legión Cívica:</b> organización paramilitar ligada al ala dura del conservadurismo, brazo de acción directa contra la oposición en la Década Infame.'],x:[['Varios actores tenían algo que perder con las denuncias de De la Torre.','I','Tener un motivo no prueba que alguien haya cometido el crimen.'],['Valdez Cora tenía vínculos con el entorno conservador y la Legión Cívica.','I','Es un vínculo señalado, no la prueba de una orden.'],['El presidente Justo ordenó el asesinato.','S','Ninguna fuente lo sostiene.'],['El Pacto Roca-Runciman era la política exterior clave del gobierno de Justo.','P','Lo señalan las fuentes sobre el Pacto y el gobierno.']]},
{f:'torre',fl:'Lisandro de la Torre',t:'Fuente primaria',h:'Diario de Sesiones, 23 de julio de 1935 (extracto)',b:[],q:'Sen. De la Torre: “Los frigoríficos han obtenido en este régimen ventajas extraordinarias […] y el Poder Ejecutivo los ampara, en vez de fiscalizarlos […] Los ministros Duhau y Hueyo han prestado su concurso para que el fraude y el contrabando se perpetúen en el país.” <br>[Griterío en el recinto. Se producen los disparos. Bordabehere cae herido. Se suspende la sesión.]',pq:'¿Qué estaba denunciando exactamente De la Torre? ¿A quiénes nombraba?',x:[['De la Torre nombró a Duhau y Hueyo en su denuncia.','P','Consta en la versión taquigráfica.'],['Los disparos ocurrieron en pleno debate.','P','Lo registra el propio Diario de Sesiones.'],['Todo lo que denunció De la Torre está comprobado.','S','Es su acusación, no un fallo.'],['El Diario de Sesiones demuestra quién ordenó el crimen.','S','Registra la sesión y los disparos, pero no menciona ninguna orden.']]}
];
