const MAX=28;
let k=0,paused=false;
const im=$('im'),cp=$('cp');
function dots(){$('dots').innerHTML=F.map((_,i)=>`<i class="${i==k?'on':''}"></i>`).join('')}
function set(i){k=(i+F.length)%F.length;im.src=F[k].s;im.alt=F[k].c;cp.textContent=F[k].c;im.classList.remove('z');void im.offsetWidth;im.classList.add('z');dots()}
function go(i){im.classList.add('out');cp.classList.add('out');setTimeout(()=>{set(i);im.classList.remove('out');cp.classList.remove('out')},900)}
setInterval(()=>{if(!paused&&!document.hidden&&!$('st').hidden&&$('ld').hidden)go(k+1)},14000);
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(k+1);else if(e.key=='ArrowLeft')go(k-1);else if(e.key==' '&&document.activeElement.tagName!='TEXTAREA'){e.preventDefault();paused=!paused}});
im.addEventListener('click',()=>go(k+1));
function pz(l){const m=l.trim().toUpperCase().match(/^(.*?)[-\s]*(\d{6})$/);if(!m||!m[1])return;const d=[...m[2]].map(Number),ps=d.slice(0,5),c=d[5];if(ps.some(v=>v>4)||c>8)return;return{n:m[1].replace(/_/g,' '),ps,c,t:ps.reduce((a,b)=>a+b,0)+c}}
function ls(){const m=new Map();$('cd').value.split('\n').forEach(l=>{const x=pz(l);if(x)m.set(x.n,x)});return[...m.values()].sort((a,b)=>b.t-a.t||b.c-a.c)}
function up(){const v=$('cd').value;try{localStorage.setItem('b35d',v)}catch(e){}
 const t=v.split('\n').filter(l=>l.trim()).length,n=ls().length;
 $('msg').textContent=t?`${n} equipo${n==1?'':'s'} reconocido${n==1?'':'s'}`+(t>n?` · ${t-n} línea${t-n>1?'s':''} sin reconocer o repetida${t-n>1?'s':''}`:''):'Pegá un código por línea.';
 $('bt').disabled=!n;
 $('n').textContent=n?`Equipos que entregaron: ${n}`:'Todavía no entregó ningún equipo'}
function op(){$('ld').hidden=false;$('cd').focus()}
function cl(){$('ld').hidden=true}
function bk(){$('rs').hidden=true;$('st').hidden=false}
function ed(){bk();op()}
function cc(){$('cl').innerHTML=`<hr><span class="stamp v">CASO CERRADO</span><h2>Lo que la historia nos enseña</h2><p>1. El ejecutor material fue Ramón Valdez Cora. Eso es indiscutible.</p><p>2. Los mandantes nunca fueron juzgados: la justicia de la Década Infame no investigó.</p><p>3. El crimen ocurrió porque el debate parlamentario amenazaba intereses económicos enormes, los del Pacto Roca-Runciman.</p><p>4. Bordabehere murió intentando proteger la única voz que denunciaba ese entramado.</p><blockquote>“No hay crimen sin contexto. En historia, el contexto es la explicación.”</blockquote>`}
function rs(){const r=ls();if(!r.length)return;
 const w=r.filter(x=>x.t==r[0].t&&x.c==r[0].c),d=r[1]?r[0].t-r[1].t:null;
 const h=w.length>1?`Empate entre ${w.map(x=>esc(x.n)).join(' y ')}`:`${esc(r[0].n)} gana${d==null?'':d>0?` por ${d} punto${d>1?'s':''} de diferencia`:' por desempate: más puntos en la conclusión'}`;
 const rows=r.map((x,i)=>`<div class="row${w.includes(x)?' w':''}"><span class="nm">${esc(x.n)}</span><div class="tr"><i class="sg a" style="--w:${x.ps.reduce((a,b)=>a+b,0)/MAX*100}%;--d:${i*.15}s"></i><i class="sg c" style="--w:${x.c/MAX*100}%;--d:${i*.15}s"></i></div><b>${x.t}</b></div>`).join('');
 const tb=`<table><tr><th>Equipo</th><th>P1</th><th>P2</th><th>P3</th><th>P4</th><th>P5</th><th>Concl.</th><th>Total</th></tr>${r.map(x=>`<tr><td>${esc(x.n)}</td>${x.ps.map(v=>`<td>${v}/4</td>`).join('')}<td>${x.c}/8</td><td><b>${x.t}/${MAX}</b></td></tr>`).join('')}</table>`;
 $('ld').hidden=true;$('st').hidden=true;$('rs').hidden=false;
 $('rs').innerHTML=`<div class="sheet wd"><span class="stamp">${w.length>1?'EMPATE':'GANADOR'}</span><div class="ban"><div class="big">${h}</div><div>${r[0].t} de ${MAX} puntos</div></div><div id="bars">${rows}</div><p class="lg"><i style="background:var(--navy)"></i>Pistas (de 20)<i style="background:var(--red)"></i>Conclusión (de 8)</p><details><summary>Ver el detalle por pista</summary>${tb}</details><button class="b" onclick="cc()">Mostrar el caso cerrado</button><div id="cl"></div><button class="b o" onclick="bk()">Volver a las fotos</button><button class="b o" onclick="ed()">Editar códigos</button></div>`;
 window.scrollTo(0,0);requestAnimationFrame(()=>requestAnimationFrame(()=>$('bars').classList.add('go')))}
try{$('cd').value=localStorage.getItem('b35d')||''}catch(e){}
up();set(0);
</script>
</body>
